<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For Sir Albert</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="envelope-wrapper">
      <input type="checkbox" id="open-envelope">
      <label for="open-envelope" class="envelope">
        <div class="letter">
          <h2>Dear Sir Albert,</h2>
          <img src="teacher-photo.jpg" alt="Teacher Photo" class="teacher-img">
          <p>Thank you so much Sir Albert for guiding us patiently through ICT. Even when the lessons start to get super confusing, you find a way to make it make sense, like when you use analogies. We really appreciate how approachable you are, making class relaxed and fun. You are an amazing teacher. Happy Teacher's Day Sir Albert :) 🧑‍🏫🏫</p>
        </div>
        <div class="flap"></div>
        <div class="pocket"></div>
      </label>
    </div>
  </main>
</body>
</html>
